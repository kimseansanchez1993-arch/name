<!DOCTYPE html>
<html>
<head>
<title>Wonderland</title>

<style>

body {background-image: url("https://i.ibb.co/Rpt0XV3r/Projects.png");}

.btn {background-color: transparent;
	border: 3px solid #f4c176;
	color: #f4c176;
	border-radius: 12px;
	font-size: 130%;
	font-family: "Colonna MT";}

  .card-trail {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    font-size: 50px;
    font-family: serif;
    z-index: 9999;
    animation: fallAndFade 1s linear forwards;
  }

  .card-burst {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    font-size: 65px;
    font-family: serif;
    z-index: 9999;
    animation: burstAndFade 0.6s ease-out forwards;
  }

  @keyframes fallAndFade {
    0% {
      transform: translateY(0) scale(1) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100px) scale(0.5) rotate(360deg);
      opacity: 0;
    }
  }

  @keyframes burstAndFade {
    0% {
      transform: translate(0, 0) scale(1) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(var(--rot));
      opacity: 0;
    }
  }

</style>
</head>
<body>

<script>

const suits = ['♠', '♥', '♦', '♣'];
const colors = ['#d395ff', 'black', 'black', '#d395ff'];
let lastMove = 0;

document.addEventListener('mousemove', function(e) {
  const now = Date.now();
  if (now - lastMove < 30) return;
  lastMove = now;

  const element = document.createElement('div');
  element.className = 'card-trail';
  
  const randomIndex = Math.floor(Math.random() * suits.length);
  element.innerText = suits[randomIndex];
  element.style.color = colors[randomIndex];

  element.style.left = (e.clientX - 10) + 'px';
  element.style.top = (e.clientY - 10) + 'px';

  const randomXDrift = (Math.random() - 0.5) * 40;
  element.style.setProperty('--drift', randomXDrift + 'px');

  document.body.appendChild(element);

  setTimeout(() => {
    element.remove();
  }, 1000);
});

document.addEventListener('click', function(e) {
  const particleCount = 8;
  const radius = 80;

  for (let i = 0; i < particleCount; i++) {
    const angle = (i / particleCount) * 2 * Math.PI;
    const targetX = Math.cos(angle) * radius;
    const targetY = Math.sin(angle) * radius;
    const randomRotation = Math.floor(Math.random() * 360) + 'deg';

    const element = document.createElement('div');
    element.className = 'card-burst';

    const randomIndex = Math.floor(Math.random() * suits.length);
    element.innerText = suits[randomIndex];
    element.style.color = colors[randomIndex];

    element.style.left = (e.clientX - 12) + 'px';
    element.style.top = (e.clientY - 12) + 'px';

    element.style.setProperty('--tx', targetX + 'px');
    element.style.setProperty('--ty', targetY + 'px');
    element.style.setProperty('--rot', randomRotation);

    document.body.appendChild(element);

    setTimeout(() => {
      element.remove();
    }, 600);
  }
});

const subjectStates = {
  AP: 0
};

const subjectTexts = {
    AP: [
    "<em>First Question:</em><br>How can the market<br>help the community?<br> <br> <br><em>Second Question:</em><br>Why is the market<br>important in our lives?",
    "The market (pamilihan) is a place <br>where everyone buys their necessities<br>and where money mostly goes around.<br>This is a form of trade that has been going on for many years.<br>Today, it’s quite common to be asked<br>to go to a store and buy something.<br>But what <em>do</em> markets do for our communities?<br>And why do we, as individuals, need it?",
    "The answer is simple, really.<br>The market ensures that every family<br>would have what they need.<br>Whether it’s something as simple as food or clothing,<br>or even school supplies, the market gives it to us.<br> Without the market, we wouldn’t have<br>everything we have right now,<br>or anything we’d need in the future.",
    "Additionally, the market ensures<br>that a nation has a stable economy.<br>Without the market, the value of money would drop,<br>whether it’s a global<br>dilemma, or a national one.<br>Truthfully speaking, money might not even <em>have</em> a value.<br> <br> <br> ",
    "Which is why, the market is important.<br>Not just in a community, but for the whole world.<br> <br> <br> <br> <br> <br> <br> "
  ],
}

function toggleSubject(subject) {
    const totalTexts = subjectTexts[subject].length;
    subjectStates[subject] = (subjectStates[subject] + 1) % totalTexts;
    const nextText = subjectTexts[subject][subjectStates[subject]];
    document.getElementById('myDIV_' + subject).innerHTML = nextText;
}

</script>
